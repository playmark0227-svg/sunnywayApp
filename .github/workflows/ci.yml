name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "preview/**"
      - "**/*.md"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-dummy-secret-not-used-at-build-time-1234567890"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build (type-check + compile)
        run: npm run build
