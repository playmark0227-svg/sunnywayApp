name: Deploy preview to GitHub Pages

# スマホアプリの静的プレビュー（preview/）を GitHub Pages へ公開する。
# Pages が未有効でも configure-pages の enablement: true で自動有効化を試みる。

on:
  push:
    branches:
      - claude/admiring-allen-RcE3w
    paths:
      - "preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ（古いデプロイはキャンセル）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
