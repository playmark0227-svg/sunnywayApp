<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sunnyway インフルエンサーアプリ｜プレビュー</title>
  <meta name="theme-color" content="#ff7f11" />
  <meta name="description" content="Sunnyway スマホアプリの静的プレビュー（デモデータ）" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Tailwind はビルド済み styles.css を使用（実行時CDN不要）。
       生成: npx tailwindcss -c preview-build/tailwind.config.js -i preview-build/input.css -o preview/styles.css --minify -->
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { -webkit-font-smoothing: antialiased; }
    .badge { display:inline-flex; align-items:center; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500; }
    .input { width:100%; border-radius:.5rem; border:1px solid #d1d5db; padding:.5rem .75rem; font-size:.875rem; outline:none; }
    .input:focus { border-color:#ff9d37; box-shadow:0 0 0 2px #ffdca8; }
    .btn { display:inline-flex; align-items:center; justify-content:center; border-radius:.5rem; padding:.5rem 1rem; font-size:.875rem; font-weight:600; transition:.15s; cursor:pointer; }
    .btn-primary { background:#ff7f11; color:#fff; }
    .btn-primary:hover { background:#f06306; }
    .btn-ghost { border:1px solid #d1d5db; background:#fff; color:#374151; }
    .card { border-radius:.75rem; border:1px solid #e5e7eb; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .tabbtn.active { color:#f06306; }
    .fade { animation: fade .25s ease; }
    @keyframes fade { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body class="bg-gray-200">
  <!-- デモ用バナー -->
  <div class="fixed left-0 right-0 top-0 z-50 bg-sunny-600 px-3 py-1.5 text-center text-xs font-medium text-white">
    ☀️ これは <b>Sunnyway スマホアプリ</b> の静的プレビューです（データはデモ／ログイン不要）
  </div>

  <!-- スマホ枠 -->
  <div class="flex min-h-screen items-start justify-center px-3 pb-10 pt-12">
    <div id="phone" class="relative flex w-full max-w-[400px] flex-col overflow-hidden rounded-[2rem] border-[10px] border-gray-900 bg-gray-50 shadow-2xl" style="height:840px;">

      <!-- トップバー -->
      <header class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3">
        <div class="flex items-center gap-1.5">
          <span class="text-lg">☀️</span>
          <span class="font-bold text-gray-900">Sunnyway</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="topHandle" class="text-sm text-gray-500">@aoi_beauty</span>
        </div>
      </header>

      <!-- 本文 -->
      <main id="view" class="flex-1 overflow-y-auto px-4 py-5"></main>

      <!-- 下部タブ -->
      <nav class="grid grid-cols-2 border-t border-gray-200 bg-white/95 backdrop-blur">
        <button data-tab="feed" class="tabbtn active flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-400">
          <span class="text-lg">🔍</span>さがす
        </button>
        <button data-tab="mine" class="tabbtn flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-400">
          <span class="text-lg">✨</span>マイ
        </button>
      </nav>
    </div>
  </div>

  <script>
    // ---------- デモ状態（インメモリ） ----------
    const fmt = (n) => (n ?? 0).toLocaleString("ja-JP");
    const yen = (n) => "¥" + fmt(n);
    const rewardLabel = { GIFTING: "ギフティング（現物提供）", PAID: "金銭報酬", BOTH: "現物＋金銭" };
    const statusLabel = { APPLIED: "応募済み", APPROVED: "承認（参加確定）", REJECTED: "却下", POSTED: "投稿提出済み" };
    const statusClass = (s) => ({
      APPLIED: "bg-gray-100 text-gray-700", APPROVED: "bg-green-100 text-green-800",
      REJECTED: "bg-red-100 text-red-700", POSTED: "bg-sunny-100 text-sunny-800",
    }[s] || "bg-gray-100 text-gray-700");

    const state = {
      tab: "feed",
      profile: { handle: "aoi_beauty", platform: "Instagram", followers: 28000, bio: "コスメと美容が大好き💄", shipping: "" },
      campaigns: [
        { id: "c1", title: "【ギフティング】グロウセラムCを使ってみて！", brand: "Lumière Cosmetics", product: "グロウセラム C",
          category: "スキンケア", rewardType: "GIFTING", rewardYen: 0, target: 15, emoji: "💧",
          brief: "2週間使用して、使用感・テクスチャーを率直にレビューしてください。ストーリーズ1回＋フィード1投稿。" },
        { id: "c2", title: "新色リップ 03 PRキャンペーン", brand: "Blossom Tokyo", product: "ベルベットリップ 03",
          category: "メイクアップ", rewardType: "BOTH", rewardYen: 5000, target: 8, emoji: "💄",
          brief: "リップスウォッチ＋着用カットを投稿してください。" },
        { id: "c3", title: "モイストクリーム 保湿チャレンジ", brand: "Lumière Cosmetics", product: "モイストクリーム",
          category: "スキンケア", rewardType: "GIFTING", rewardYen: 0, target: 10, emoji: "🧴",
          brief: "夜のスキンケアに2週間使って、翌朝の肌の様子を投稿してください。" },
      ],
      // 取り上げ済みの実績を1件プリセット（マイの統計を見せるため）
      applications: [
        { campaignId: "c3", status: "POSTED", postUrl: "https://www.instagram.com/p/demo", postReach: 18400 },
      ],
    };

    const campaignById = (id) => state.campaigns.find((c) => c.id === id);
    const appByCampaign = (id) => state.applications.find((a) => a.campaignId === id);

    // ---------- レンダリング ----------
    const view = document.getElementById("view");

    function rewardChips(c) {
      const chips = [];
      if (c.rewardType !== "GIFTING" && c.rewardYen > 0) chips.push(`<span>💰 報酬 <b>${yen(c.rewardYen)}</b></span>`);
      if (c.rewardType !== "PAID") chips.push(`<span>🎁 現物提供</span>`);
      chips.push(`<span class="text-gray-400">募集 ${c.target}人</span>`);
      return chips.join("");
    }

    function renderFeed() {
      const open = state.campaigns.filter((c) => !appByCampaign(c.id));
      const cards = open.map((c) => `
        <article class="card overflow-hidden">
          <div class="flex h-40 items-center justify-center bg-sunny-50 text-6xl">${c.emoji}</div>
          <div class="p-4">
            <div class="flex items-center gap-2">
              <span class="badge bg-sunny-100 text-sunny-700">${rewardLabel[c.rewardType]}</span>
              <span class="badge bg-gray-100 text-gray-600">${c.category}</span>
            </div>
            <h2 class="mt-2 font-bold text-gray-900">${c.title}</h2>
            <p class="text-sm text-gray-500">${c.brand} / ${c.product}</p>
            <p class="mt-2 text-sm text-gray-600">${c.brief}</p>
            <div class="mt-3 flex flex-wrap items-center gap-4 text-sm text-gray-600">${rewardChips(c)}</div>
            <button class="btn btn-primary mt-4 w-full" data-apply="${c.id}">この案件に応募する</button>
          </div>
        </article>`).join("");

      view.innerHTML = `
        <div class="fade">
          <h1 class="text-xl font-bold text-gray-900">募集中の案件</h1>
          <p class="mt-0.5 text-sm text-gray-500">気になるコスメに応募して、投稿しよう</p>
          <div class="mt-4 space-y-4">
            ${open.length ? cards : `<div class="rounded-xl border border-dashed border-gray-300 p-8 text-center text-sm text-gray-400">いまは募集中の案件がありません。<br>また見にきてね ☀️</div>`}
          </div>
        </div>`;

      view.querySelectorAll("[data-apply]").forEach((btn) =>
        btn.addEventListener("click", () => {
          state.applications.push({ campaignId: btn.dataset.apply, status: "APPLIED", postUrl: "", postReach: 0 });
          toast("応募しました！マイページで確認できます ✨");
          render();
        })
      );
    }

    function renderMine() {
      const apps = state.applications;
      const postedCount = apps.filter((a) => a.status === "POSTED").length;
      const totalReach = apps.reduce((s, a) => s + (a.postReach || 0), 0);
      const p = state.profile;

      const appCards = apps.map((a) => {
        const c = campaignById(a.campaignId);
        const canSubmit = a.status === "APPROVED" || a.status === "POSTED";
        return `
        <div class="card p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="truncate font-semibold text-gray-900">${c.title}</p>
              <p class="truncate text-xs text-gray-500">${c.brand} / ${c.product} ・ ${rewardLabel[c.rewardType]}</p>
            </div>
            <span class="badge ${statusClass(a.status)}">${statusLabel[a.status]}</span>
          </div>
          ${a.status === "APPLIED" ? `
            <div class="mt-3 border-t border-gray-100 pt-3 text-xs text-gray-500">
              運営の承認待ちです。
              <button class="ml-1 font-semibold text-sunny-600 underline" data-approve="${a.campaignId}">［デモ：承認をシミュレート］</button>
            </div>` : ""}
          ${canSubmit ? `
            <div class="mt-3 border-t border-gray-100 pt-3">
              <p class="mb-2 text-xs font-medium text-gray-500">${a.status === "POSTED" ? "提出済み（更新も可能）" : "投稿したら URL を提出してください"}</p>
              <div class="space-y-2">
                <input class="input" placeholder="https://www.instagram.com/p/…" value="${a.postUrl || ""}" data-url="${a.campaignId}" />
                <input class="input" type="number" min="0" placeholder="リーチ / 表示回数" value="${a.postReach || ""}" data-reach="${a.campaignId}" />
                <button class="btn btn-primary w-full" data-submit="${a.campaignId}">投稿を提出する</button>
              </div>
            </div>` : ""}
          ${a.status === "REJECTED" ? `<p class="mt-2 text-xs text-gray-400">今回は見送りとなりました。</p>` : ""}
        </div>`;
      }).join("");

      view.innerHTML = `
        <div class="fade space-y-6">
          <section class="card p-4">
            <div class="flex items-center gap-3">
              <div class="flex h-12 w-12 items-center justify-center rounded-full bg-sunny-100 text-2xl">✨</div>
              <div>
                <p class="font-bold text-gray-900">@${p.handle}</p>
                <p class="text-xs text-gray-500">${p.platform} ・ フォロワー ${fmt(p.followers)}</p>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-3 gap-2 text-center">
              ${mini("応募", apps.length)}${mini("取り上げ", postedCount)}${mini("累計リーチ", fmt(totalReach))}
            </div>
          </section>

          <section>
            <h2 class="mb-2 font-bold text-gray-900">応募・参加状況</h2>
            ${apps.length ? `<div class="space-y-3">${appCards}</div>` :
              `<p class="rounded-xl border border-dashed border-gray-300 p-6 text-center text-sm text-gray-400">まだ応募がありません。「さがす」から案件に応募してみよう。</p>`}
          </section>

          <section class="card p-4">
            <h2 class="mb-3 font-bold text-gray-900">プロフィール設定</h2>
            <div class="space-y-3">
              <div><label class="mb-1 block text-sm font-medium text-gray-700">フォロワー数</label>
                <input class="input" type="number" min="0" value="${p.followers}" id="pf-followers" /></div>
              <div><label class="mb-1 block text-sm font-medium text-gray-700">自己紹介</label>
                <textarea class="input" rows="2" id="pf-bio">${p.bio}</textarea></div>
              <div><label class="mb-1 block text-sm font-medium text-gray-700">発送先住所（ギフティング用）</label>
                <textarea class="input" rows="2" id="pf-ship" placeholder="現物提供の案件で使用します">${p.shipping}</textarea></div>
              <button class="btn btn-primary w-full" id="pf-save">保存する</button>
            </div>
          </section>
        </div>`;

      view.querySelectorAll("[data-approve]").forEach((b) =>
        b.addEventListener("click", () => { appByCampaign(b.dataset.approve).status = "APPROVED"; toast("運営が承認しました（デモ）"); render(); }));
      view.querySelectorAll("[data-submit]").forEach((b) =>
        b.addEventListener("click", () => {
          const id = b.dataset.submit;
          const url = view.querySelector(`[data-url="${id}"]`).value.trim();
          const reach = parseInt(view.querySelector(`[data-reach="${id}"]`).value || "0", 10);
          if (!url) { toast("投稿 URL を入力してください"); return; }
          const a = appByCampaign(id); a.status = "POSTED"; a.postUrl = url; a.postReach = reach;
          toast("投稿を提出しました。ありがとうございます！"); render();
        }));
      const save = view.querySelector("#pf-save");
      if (save) save.addEventListener("click", () => {
        p.followers = parseInt(view.querySelector("#pf-followers").value || "0", 10);
        p.bio = view.querySelector("#pf-bio").value;
        p.shipping = view.querySelector("#pf-ship").value;
        toast("プロフィールを保存しました"); render();
      });
    }

    function mini(label, value) {
      return `<div class="rounded-lg bg-gray-50 py-2"><div class="text-lg font-bold text-gray-900">${value}</div><div class="text-xs text-gray-500">${label}</div></div>`;
    }

    // ---------- トースト ----------
    let toastTimer;
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.className = "pointer-events-none absolute bottom-20 left-1/2 z-20 -translate-x-1/2 rounded-full bg-gray-900/90 px-4 py-2 text-sm text-white opacity-0 transition";
        document.getElementById("phone").appendChild(el);
      }
      el.textContent = msg;
      el.style.opacity = "1";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.style.opacity = "0"), 1800);
    }

    // ---------- タブ・描画 ----------
    function render() {
      document.getElementById("topHandle").textContent = "@" + state.profile.handle;
      document.querySelectorAll(".tabbtn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
      state.tab === "feed" ? renderFeed() : renderMine();
    }
    document.querySelectorAll(".tabbtn").forEach((b) =>
      b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));

    render();
  </script>
</body>
</html>
